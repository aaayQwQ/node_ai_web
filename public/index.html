<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#212121">
  <title>Node AI Web</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <button class="icon-button mobile-menu" id="mobileMenu" aria-label="打开侧边栏">☰</button>
      <span class="brand-mark" aria-hidden="true">◈</span>
      <span class="brand-name">Node AI Web</span>
      <button class="icon-button" id="collapseSidebar" aria-label="收起侧边栏" title="收起侧边栏">◧</button>
    </div>

    <button class="new-chat" id="newChat">
      <span aria-hidden="true">＋</span>
      <span>新建对话</span>
    </button>

    <div class="history-heading">最近</div>
    <nav class="history-list" id="history" aria-label="历史对话"></nav>

    <div class="sidebar-bottom">
      <button class="nav-button" id="settingsBtn"><span>⚙</span><span>设置</span></button>
      <button class="nav-button" id="pluginsBtn"><span>▦</span><span>插件</span></button>
      <button class="nav-button" id="statusBtn"><span>◉</span><span>系统状态</span></button>
      <button class="profile-button" id="profileBtn">
        <span class="profile-avatar">N</span>
        <span class="profile-copy"><strong>本地工作区</strong><small>Node AI Web</small></span>
        <span class="profile-menu">···</span>
      </button>
    </div>
  </aside>

  <main class="app-main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-button mobile-menu" id="mobileMenuTop" aria-label="打开菜单">☰</button>
        <button class="model-menu" id="modelMenu" title="选择模型">
          <span id="currentModel">默认模型</span><span class="chevron">⌄</span>
        </button>
        <select id="modelSelect" aria-label="选择模型"><option value="">使用默认模型</option></select>
      </div>
      <div class="topbar-right">
        <span class="connection-dot" id="connectionDot"></span>
        <span class="connection-label" id="status">正在连接</span>
        <button class="icon-button" id="themeBtn" title="切换外观" aria-label="切换外观">◐</button>
      </div>
    </header>

    <section class="chat-scroll" id="messages" aria-live="polite">
      <div class="welcome">
        <div class="welcome-mark">◈</div>
        <h1>有什么可以帮忙？</h1>
        <p>输入问题，开始一段新的对话。</p>
      </div>
    </section>

    <div class="composer-wrap">
      <form class="composer" id="composer">
        <textarea id="prompt" rows="1" aria-label="发送消息"
          placeholder="向 Node AI Web 发送消息"></textarea>
        <div class="composer-tools">
          <div class="composer-hint">AI 也可能会出错。请核查重要信息。</div>
          <div class="composer-actions">
            <button type="button" class="icon-button" id="attachBtn" title="当前版本暂不支持附件" aria-label="附件">＋</button>
            <button type="button" class="icon-button" id="thinkingBtn" title="切换思考模式" aria-label="切换思考模式">◉</button>
            <button type="submit" class="send-button" id="send" aria-label="发送消息">↑</button>
            <button type="button" class="send-button stop-button" id="stop" aria-label="停止生成" hidden>■</button>
          </div>
        </div>
      </form>
      <div class="footer-note">本地运行 · API Key 保存在本机</div>
    </div>
  </main>

  <dialog class="modal" id="settings">
    <form method="dialog" id="settingsForm">
      <div class="modal-header">
        <div><h2>设置</h2><p>连接兼容 OpenAI Chat Completions 的 API。</p></div>
        <button class="icon-button close-modal" aria-label="关闭">×</button>
      </div>
      <label>API Base URL
        <input id="baseURL" placeholder="https://api.deepseek.com/v1" spellcheck="false">
        <small>可以填写域名或以 /v1 结尾的地址；程序会处理重复的 /v1。</small>
      </label>
      <label>API Key
        <input id="apiKey" type="password" autocomplete="new-password" placeholder="留空则保留已保存的密钥">
      </label>
      <label>默认模型
        <div class="input-with-action">
          <input id="model" placeholder="例如 deepseek-chat">
          <button type="button" id="refreshModels">读取模型</button>
        </div>
      </label>
      <label>系统提示词
        <textarea id="systemPrompt" rows="3" placeholder="定义助手的行为和风格"></textarea>
      </label>
      <div class="form-grid">
        <label>Temperature
          <input id="temperature" type="number" min="0" max="2" step="0.1">
        </label>
        <label>网页访问密码（可选）
          <input id="webPassword" type="password" autocomplete="new-password">
        </label>
      </div>
      <div class="modal-actions">
        <button type="button" id="testConnection">测试连接</button>
        <button type="button" class="primary-button" id="saveSettings">保存设置</button>
      </div>
      <p class="form-result" id="settingsResult" role="status"></p>
    </form>
  </dialog>

  <dialog class="modal" id="plugins">
    <form method="dialog">
      <div class="modal-header"><div><h2>插件</h2><p>管理本地加载的扩展。</p></div><button class="icon-button close-modal" aria-label="关闭">×</button></div>
      <div id="pluginList" class="plugin-list"></div>
    </form>
  </dialog>

  <dialog class="modal" id="statusDialog">
    <form method="dialog">
      <div class="modal-header"><div><h2>系统状态</h2><p>当前本地服务信息。</p></div><button class="icon-button close-modal" aria-label="关闭">×</button></div>
      <pre id="statusInfo">加载中…</pre>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
