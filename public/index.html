<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Node AI Web</title><link rel="stylesheet" href="/style.css"></head><body>
<aside id="sidebar"><div class="brand">◈ Node AI Web</div><button id="newChat" class="primary">＋ 新建对话</button><div class="sideTitle">历史对话</div><div id="history" class="history"></div><div class="sideBottom"><button id="settingsBtn">⚙ 设置</button><button id="pluginsBtn">▦ 插件</button><button id="statusBtn">◉ 系统状态</button><button id="themeBtn">◐ 切换主题</button></div></aside>
<main><header><div><strong id="chatTitle">新对话</strong><small id="status">正在连接本地服务…</small></div><select id="modelSelect" aria-label="模型"><option value="">使用默认模型</option></select></header><section id="messages"><div class="welcome"><div class="logo">◈</div><h1>有什么可以帮忙？</h1><p>配置兼容 OpenAI API 的服务商，然后开始对话。</p></div></section><div class="composer"><textarea id="prompt" rows="1" placeholder="发送消息…（Enter 发送，Shift+Enter 换行）"></textarea><button id="send" class="primary">发送 ↑</button><button id="stop" hidden>停止 ■</button></div><div class="foot">Node AI Web · 本地运行 · API Key 仅保存在本机配置文件</div></main>
<dialog id="settings"><form method="dialog"><div class="modalHead"><h2>设置</h2><button class="x">×</button></div><label>API Base URL<input id="baseURL" placeholder="https://api.deepseek.com"></label><label>API Key<input id="apiKey" type="password" autocomplete="off" placeholder="sk-...（留空则保留现有密钥）"></label><label>默认模型<input id="model" placeholder="deepseek-chat"></label><label>系统提示词<textarea id="systemPrompt" rows="3"></textarea></label><div class="two"><label>Temperature<input id="temperature" type="number" min="0" max="2" step="0.1"></label><label>网页密码（可选）<input id="webPassword" type="password"></label></div><div class="modalActions"><button type="button" id="testConnection">测试连接</button><button type="button" id="saveSettings" class="primary">保存设置</button></div><p id="settingsResult" class="hint"></p></form></dialog>
<dialog id="plugins"><form method="dialog"><div class="modalHead"><h2>插件管理</h2><button class="x">×</button></div><div id="pluginList"></div></form></dialog><dialog id="statusDialog"><form method="dialog"><div class="modalHead"><h2>系统状态</h2><button class="x">×</button></div><pre id="statusInfo">加载中…</pre></form></dialog><script src="/app.js"></script></body></html>
